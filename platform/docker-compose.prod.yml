services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: elevated
      POSTGRES_PASSWORD: elevated
      POSTGRES_DB: elevated_jobs
    volumes:
      - elevated_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elevated -d elevated_jobs"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://elevated:elevated@db:5432/elevated_jobs?schema=public}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3301:3301"
    command: sh -c "npm run start -- -p 3301 -H 0.0.0.0"

  # End-of-day Partner payment reconcile (keeps amountPaid / dated events aligned with ProLine).
  # Override hour/TZ via platform/.env if needed. Logs: docker compose logs -f partner-daily
  partner-daily:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://elevated:elevated@db:5432/elevated_jobs?schema=public}
      TZ: ${PARTNER_DAILY_TZ:-America/New_York}
      PARTNER_DAILY_RECONCILE: "1"
      PARTNER_DAILY_RECONCILE_APPLY: ${PARTNER_DAILY_RECONCILE_APPLY:-1}
      PARTNER_DAILY_RECONCILE_HOUR: ${PARTNER_DAILY_RECONCILE_HOUR:-23}
      PARTNER_DAILY_RECONCILE_MINUTE: ${PARTNER_DAILY_RECONCILE_MINUTE:-0}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run proline:partner-daily"

volumes:
  elevated_pg:
